<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>__TITLE__ · __BRAND_NAME__</title>
<style>
  :root { --accent: #6d5efc; --ink: #14121a; --body: #3d3a45; --muted: #77737f; --line: #e8e6ec; --soft: #f7f6f9; --bg: #fff; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #f4f3f7; --body: #cfccd6; --muted: #918d99; --line: #2a2830; --soft: #17161b; --bg: #0e0d11; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--body); font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
  header { display: flex; align-items: center; gap: 10px; padding: 16px 24px; border-bottom: 1px solid var(--line); }
  .dot { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); }
  header b { color: var(--ink); }
  main { max-width: 1180px; margin: 0 auto; padding: 24px; display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 28px; }
  h1 { color: var(--ink); font-size: 24px; line-height: 1.25; margin: 18px 0 8px; letter-spacing: -0.01em; }
  video { width: 100%; border-radius: 14px; background: #000; display: block; aspect-ratio: 16 / 10; }
  .summary { margin: 0 0 16px; }
  .langs { margin-top: 10px; color: var(--muted); font-size: 13px; }
  .langs select { margin-left: 6px; padding: 4px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; }
  .card { border: 1px solid var(--line); border-radius: 14px; background: var(--soft); padding: 14px 16px; margin-bottom: 16px; }
  .card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 8px; }
  .chap, .cue { display: flex; gap: 10px; width: 100%; text-align: left; background: none; border: 0; padding: 6px 4px; border-radius: 8px; color: var(--body); font: inherit; cursor: pointer; }
  .chap:hover, .cue:hover { background: var(--line); }
  .chap time, .cue time { color: var(--accent); font-variant-numeric: tabular-nums; min-width: 42px; }
  .cue.on { background: color-mix(in srgb, var(--accent) 14%, transparent); }
  #transcript { max-height: 420px; overflow: auto; }
  form { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; }
  button.go { padding: 10px 14px; border-radius: 10px; border: 0; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  #answer { margin-top: 10px; white-space: pre-wrap; }
  #answer a { color: var(--accent); cursor: pointer; text-decoration: underline; }
  footer { text-align: center; color: var(--muted); font-size: 13px; padding: 30px; }
  footer a { color: inherit; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header><span class="dot"></span><b id="brand"></b></header>
<main>
  <section>
    <video id="v" controls playsinline preload="metadata"></video>
    <div class="langs" id="langs" hidden><label>Captions <select id="lang"></select></label></div>
    <h1 id="title"></h1>
    <p class="summary" id="summary"></p>
  </section>
  <aside>
    <div class="card" id="chapters-card" hidden><h2>Chapters</h2><div id="chapters"></div></div>
    <div class="card" id="ask-card" hidden>
      <h2>Ask this video</h2>
      <form id="ask"><input id="q" placeholder="What did they say about..." maxlength="500" required /><button class="go">Ask</button></form>
      <div id="answer"></div>
    </div>
    <div class="card" id="transcript-card" hidden><h2>Transcript</h2><div id="transcript"></div></div>
  </aside>
</main>
<footer>Recorded with <a id="repo" target="_blank" rel="noopener"></a>. Runs on the sender's computer; this link stops working when they close the app.</footer>
<script>
  const BRAND = __BRAND__, SHARE = __SHARE__;
  const $ = (id) => document.getElementById(id);
  document.documentElement.style.setProperty("--accent", BRAND.accent);
  $("brand").textContent = BRAND.name;
  $("repo").textContent = BRAND.name; $("repo").href = BRAND.repo;
  const v = $("v");
  v.src = "/media/" + SHARE + ".mp4";
  v.poster = "/thumb/" + SHARE + ".jpg";
  const t = document.createElement("track");
  Object.assign(t, { kind: "captions", label: "English", srclang: "en", src: "/captions/" + SHARE + ".vtt", default: true });
  v.appendChild(t);
  const mmss = (s) => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
  const seek = (s) => { v.currentTime = s; v.play(); };
  const row = (cls, start, text) => {
    const b = document.createElement("button"); b.className = cls;
    const tm = document.createElement("time"); tm.textContent = mmss(start);
    const sp = document.createElement("span"); sp.textContent = text;
    b.append(tm, sp); b.onclick = () => seek(start); return b;
  };
  fetch("/api/v/" + SHARE).then((r) => r.json()).then((m) => {
    $("title").textContent = m.title; document.title = m.title + " · " + BRAND.name;
    $("summary").textContent = m.summary || "";
    if (m.chapters.length) { $("chapters-card").hidden = false; m.chapters.forEach((c) => $("chapters").append(row("chap", c.start, c.title))); }
    if (m.cues.length) {
      $("transcript-card").hidden = false;
      const els = m.cues.map(([a, , text]) => { const e = row("cue", a, text); $("transcript").append(e); return [a, e]; });
      v.addEventListener("timeupdate", () => els.forEach(([a, e], i) => e.classList.toggle("on", v.currentTime >= a && (i + 1 >= els.length || v.currentTime < els[i + 1][0]))));
    }
    $("ask-card").hidden = !m.can_ask;
    if (m.languages.length) {
      const sel = $("lang");
      [["en", "English"], ...m.languages, ["off", "Off"]].forEach(([code, name]) => sel.append(new Option(name, code)));
      m.languages.forEach(([code, name]) => {
        const tr = document.createElement("track");
        Object.assign(tr, { kind: "captions", label: name, srclang: code, src: "/captions/" + SHARE + ".vtt?lang=" + code });
        v.appendChild(tr);
      });
      sel.onchange = () => Array.from(v.textTracks).forEach((t) => { t.mode = t.language === sel.value ? "showing" : "hidden"; });
      $("langs").hidden = false;
    }
  });
  $("ask").onsubmit = async (e) => {
    e.preventDefault();
    const out = $("answer"); out.textContent = "Thinking...";
    const r = await fetch("/api/v/" + SHARE + "/ask", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ question: $("q").value }) });
    const a = await r.json();
    if (!r.ok) { out.textContent = a.error || "Something went wrong."; return; }
    out.textContent = a.answer;
    a.timestamps.forEach((s) => { const l = document.createElement("a"); l.textContent = " [" + mmss(s) + "]"; l.onclick = () => seek(s); out.append(l); });
  };
</script>
</body>
</html>
