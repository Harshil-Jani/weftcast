[package]
name = "cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Command line and MCP server for AI agents (bundled inside the app as a sidecar)"

[dependencies]
app = { path = ".." }
anyhow = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "signal"] }
